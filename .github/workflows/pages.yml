name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site
        shell: bash
        run: |
          mkdir -p "_site/export" "_site/Vstupné projekty" "_site/Texas/slides"
          if compgen -G "Texas/slides/*" > /dev/null; then
            cp Texas/slides/* "_site/Texas/slides/"
          fi
          cp index.html favicon.svg .nojekyll _site/
          cp export/sosa-skolsky-zakon.pdf export/sosa-skolsky-zakon.pptx \
             export/sosa-tier1.pdf export/sosa-tier1.pptx \
             export/sosa-tier2.pdf export/sosa-tier2.pptx \
             export/sosa-tier3.pdf export/sosa-tier3.pptx \
             export/pohyb-rovnomerny.pdf export/pohyb-rovnomerny.pptx \
             export/vizualne-prvky.pdf export/vizualne-prvky.pptx \
             export/texas-maxim.pdf export/texas-maxim.pptx \
             _site/export/
          cp "Vstupné projekty/Texas_Maxim_Hrehor_Static.html" \
             "Vstupné projekty/DOCTYPE_SOŠa_AdaptiveTiersDemo_Static.html" \
             "Vstupné projekty/DOCTYPE_SOŠa_AdaptiveTiersDemo_Dynamic.html" \
             "Vstupné projekty/DOCTYPE_SOŠa_AdaptiveTiersDemo_Dynamic_Optimalized.html" \
             "Vstupné projekty/Demonštrácia rovnomerného pohybu_IV_Hrehor.html" \
             "Vstupné projekty/Ukážka vizuálnych prvkov_Claude.html" \
             "_site/Vstupné projekty/"

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
