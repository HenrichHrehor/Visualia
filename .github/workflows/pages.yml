name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site
        shell: bash
        run: |
          mkdir -p "_site/export" "_site/Texas/slides" "_site/Texas/gov"
          if compgen -G "Texas/slides/*" > /dev/null; then
            cp Texas/slides/* "_site/Texas/slides/"
          fi
          if compgen -G "Texas/gov/*.jpg" > /dev/null; then
            cp Texas/gov/*.jpg "_site/Texas/gov/"
          fi
          cp index.html favicon.svg .nojekyll _site/
          cp -a export/texas export/sosa export/pohyb export/vizualne-prvky "_site/export/"

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
