<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<title>Reforma Sociálnych Služieb 2026 — KSK Tier 1</title>
<style>
/* =========================================================================
   VRSTVA 1 — ENGINE (NEMENNÉ A4 LANDSCAPE)
   ========================================================================= */
@page { size: A4 landscape; margin: 0; }
* { box-sizing: border-box; }
body { margin: 0; padding: 0; background: #e2e8f0; font-family: 'Inter', 'Segoe UI', sans-serif; display: block; }

.deck-container { width: 100%; height: auto; background-color: transparent; display: block; }

.slide {
    width: 297mm; height: 210mm; margin: 0 auto; padding: 20mm;
    display: flex; flex-direction: column; background: var(--bg);
    page-break-after: always; break-after: page; position: relative; overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

@media print {
    body { background: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .slide { box-shadow: none; border: none; margin: 0; }
}

.header { flex-shrink: 0; border-bottom: 3px solid var(--secondary); padding-bottom: 10px; margin-bottom: 15px; }
.header-tag { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--secondary); margin-bottom: 4px; }
.title { font-size: 28px; font-weight: 800; margin: 0; color: var(--primary); text-transform: var(--title-transform, none); }

.content { flex: 1; min-height: 0; display: flex; flex-direction: column;}
.footer { position: absolute; bottom: 15px; left: 20mm; right: 20mm; padding-top: 8px; border-top: 1px solid #cbd5e1; text-align: center; font-size: 13px; font-weight: 600; color: #64748b; display: flex; justify-content: space-between;}

strong { color: var(--gold-color); }
.law-ref { color: #000; font-weight: 800; }
.highlight-red { color: #dc2626; font-weight: 900; }

.box-title { display: block; font-weight: 800; color: var(--primary); margin-bottom: 12px; font-size: 22px; line-height: 1.3;}
.text-content { font-size: 18px; line-height: 1.6; color: var(--text); margin: 0; text-align: justify;}

table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 15px; }
th, td { border: 1px solid #cbd5e1; padding: 8px 12px; text-align: left; }
th { background-color: var(--primary); color: white; font-weight: 700; }
tr:nth-child(even) { background-color: #f8fafc; }

/* =========================================================================
   VRSTVA 2 — ŠABLÓNY OBSAHU
   ========================================================================= */
.content.grid-cards-4 { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 15px; }
.content.grid-cards-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr; gap: 15px; }
.content.grid-cards-2 { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; gap: 30px; align-content: stretch;}
.content.grid-cards-1 { display: grid; grid-template-columns: 1fr; grid-template-rows: 1fr; gap: 30px; padding: 10px 40px; height: 100%; }
.content.single-block { display: flex; align-items: flex-start; justify-content: center; padding: 0; height: 100%; }
.content.list-block { display: flex; flex-direction: column; gap: 14px; justify-content: center;}

/* OPRAVENÁ ŠABLÓNA: HORIZONTAL TIMELINE */
.content.timeline-horizontal { display: flex; flex-direction: row; justify-content: space-between; align-items: stretch; position: relative; gap: 30px; padding-top: 20px; height: 100%; }
.content.timeline-horizontal::before { content: ''; position: absolute; top: 42px; left: 16%; right: 16%; height: 6px; background: var(--secondary); z-index: 1; }
.timeline-step { position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column; align-items: center; }
.timeline-badge { flex-shrink: 0; width: 50px; height: 50px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 22px; margin-bottom: 25px; border: 6px solid var(--bg); }
.timeline-card { background: var(--card); border-radius: var(--radius); padding: 30px; box-shadow: 0 4px 10px rgba(0,0,0,.08); border-top: var(--accent-w) solid var(--primary); width: 100%; flex: 1; text-align: left; }
.timeline-date { display: block; font-weight: 800; color: var(--secondary); font-size: 14px; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
.timeline-card .box-title { font-size: 20px; margin-bottom: 10px; color: var(--primary); }
.timeline-card .text-content { font-size: 17px; line-height: 1.5; }

.card { background: var(--card); padding: 25px; border-radius: var(--radius); border-left: var(--accent-w) solid var(--secondary); box-shadow: 0 4px 8px rgba(0,0,0,.05); display: flex; flex-direction: column; justify-content: center; }
.grid-cards-2 .card { padding: 35px; }
.grid-cards-1 .card { padding: 40px; justify-content: center; align-items: center; text-align: center; }
.grid-cards-1 .text-content { font-size: 26px; line-height: 1.6; text-align: center;}
.grid-cards-1 .box-title { font-size: 34px; margin-bottom: 25px;}

.single-card { width: 100%; margin: auto 0; padding: 30px 50px; text-align: left; background: var(--card); border-radius: var(--radius); box-shadow: 0 4px 8px rgba(0,0,0,.05); border-top: var(--accent-w) solid var(--secondary); }
.single-card .box-title { font-size: 24px; margin-bottom: 15px; color: var(--primary);}
.single-card .text-content { font-size: 17px; line-height: 1.5; }

.list-item { flex: 1; display: flex; align-items: center; gap: 22px; background: var(--card); border-radius: var(--radius); padding: 18px 30px; box-shadow: 0 4px 8px rgba(0,0,0,.05); border-left: var(--accent-w) solid var(--secondary); }
.list-marker { flex-shrink: 0; width: 45px; height: 45px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; }
.list-body { flex: 1; }

.hero { justify-content: center; align-items: center; text-align: center; color: #fff; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); }
.hero-title { font-size: 46px; color: white; margin: 0; font-weight: 800; line-height: 1.2; padding: 0 40px;}
.hero-subtitle { font-size: 26px; margin-top: 20px; color: #f1f5f9; font-weight: 400; }
.hero-author { margin-top: 50px; font-size: 20px; line-height: 1.5; color: #cbd5e1;}

}
</style>

/* =========================================================================
   RENDER LOGIKA
   ========================================================================= */
function card(b) { return `<div class="card"><span class="box-title">${b.t}</span><div class="text-content">${b.d}</div></div>`; }
function timelineStep(step, i) {
    return `<div class="timeline-step"><div class="timeline-badge">${i + 1}</div><div class="timeline-card"><span class="timeline-date">${step.date}</span><span class="box-title">${step.t}</span><div class="text-content">${step.d}</div></div></div>`;
}
function listItem(it, i) { return `<div class="list-item"><div class="list-marker">${i + 1}</div><div class="list-body"><span class="box-title">${it.t}</span><div class="text-content">${it.d}</div></div></div>`; }

const renderers = {
    "grid-4": s => `<div class="content grid-cards-4">${s.boxes.map(card).join('')}</div>`,
    "grid-3": s => `<div class="content grid-cards-3">${s.boxes.map(card).join('')}</div>`,
    "grid-2-airy": s => `<div class="content grid-cards-2">${s.boxes.map(card).join('')}</div>`,
    "grid-1": s => `<div class="content grid-cards-1">${s.boxes.map(card).join('')}</div>`,
    "timeline-horizontal": s => `<div class="content timeline-horizontal">${s.steps.map(timelineStep).join('')}</div>`,
    "single-block": s => `<div class="content single-block"><div class="single-card"><span class="box-title">${s.heading}</span><div class="text-content">${s.body}</div></div></div>`,
    "list": s => `<div class="content list-block">${s.items.map(listItem).join('')}</div>`
};

function buildSlide(s, index, total) {
    const themeClass = `theme-${s.theme}`;
    if (s.template === "hero") {
        return `<div class="slide ${themeClass} hero">
            <h1 class="hero-title">${s.title}</h1>
            ${s.subtitle ? `<p class="hero-subtitle">${s.subtitle}</p>` : ''}
            <div class="hero-author"><strong>${s.author}</strong></div>
            <div class="footer"><span style="width:100%; text-align:center;">${AUTHOR} | Snímka ${index + 1}/${total}</span></div>
        </div>`;
    }
    const headerHtml = `<div class="header">${s.tag ? `<div class="header-tag">${s.tag}</div>` : ''}<h1 class="title">${s.title}</h1></div>`;
    const contentHtml = renderers[s.template](s);
    const footerHtml = `<div class="footer"><span>${AUTHOR}</span><span>Snímka ${index + 1}/${total}</span></div>`;
    return `<div class="slide ${themeClass}">${headerHtml}${contentHtml}${footerHtml}</div>`;
}

document.getElementById('slides').innerHTML = data.map((slide, index) => buildSlide(slide, index, data.length)).join('');
</script>
