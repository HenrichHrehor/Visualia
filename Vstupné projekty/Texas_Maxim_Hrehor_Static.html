<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Texas — Maxim Hrehor, Kvinta</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
@page { size: A4 landscape; margin: 0; }
* { box-sizing: border-box; }
body { margin: 0; padding: 0; background: #e7eef6; font-family: 'Segoe UI', sans-serif; }
.deck-container { width: 100%; }
.slide {
    width: 297mm; height: 210mm; margin: 0 auto 16px; padding: 8mm 8mm 12mm;
    display: flex; flex-direction: column; background: #e7d7b1;
    page-break-after: always; break-after: page; position: relative; overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,.1);
}
.pair { flex: 1; min-height: 0; display: grid; grid-template-columns: 0.82fr 1.18fr; gap: 7mm; }
.pcard { position: relative; border-radius: 16px; border: 2px solid #123a63; background: #fffdf8; box-shadow: 0 7px 0 rgba(18,58,99,.16); overflow: hidden; min-height: 0; }
.pcard.photo { background: #123a63; }
.scene, .pcard.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.pip { position: absolute; z-index: 4; top: 8px; left: 10px; color: #fff; font-weight: 800; font-size: 16px; letter-spacing: .04em; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
.credit { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; padding: 16px 12px 8px; background: linear-gradient(transparent, rgba(8,24,44,.9)); color: #fff; font-size: 12px; font-weight: 700; line-height: 1.25; }
.textcard { display: flex; }
.spine { width: 58px; flex-shrink: 0; background: #123a63; color: #ffe08a; display: flex; align-items: center; justify-content: center; writing-mode: vertical-rl; text-orientation: upright; font-weight: 800; font-size: 26px; letter-spacing: .42em; }
.sheet { flex: 1; min-width: 0; min-height: 0; padding: 14px 16px 10px; display: flex; flex-direction: column; }
@media print {
    body { background: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .slide { box-shadow: none; margin: 0; }
}
body.present { margin: 0; height: 100vh; overflow: hidden; background: #0c1422; }
body.present .deck-container { width: 100vw; height: 100vh; }
body.present .slide { display: none; margin: 0; box-shadow: none; }
body.present .slide.active { display: flex; position: fixed; left: 50%; top: 50%; margin: 0; transform: translate(-50%, -50%) scale(var(--fit, 1)); transform-origin: center center; }
.present-bar { position: fixed; z-index: 20; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 999px; background: rgba(12, 20, 34, .82); color: #fff; }
.present-bar button { border: 0; border-radius: 999px; background: #e8b84a; color: #123a63; font: inherit; font-weight: 800; padding: 8px 14px; cursor: pointer; }
.present-bar span { min-width: 72px; text-align: center; font-weight: 700; }
.header { flex-shrink: 0; border-bottom: 3px solid var(--secondary); padding-bottom: 8px; margin-bottom: 12px; }
.header-tag { font-size: 0.95rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: var(--secondary); margin-bottom: 4px; }
.title { font-size: 34px; font-weight: 800; margin: 0; color: var(--primary); line-height: 1.08; }
.content { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.footer { position: absolute; bottom: 4px; left: 8mm; right: 8mm; border-top: 0; font-size: 12px; font-weight: 700; color: #5c4b32; display: flex; justify-content: space-between; }
strong { color: var(--gold-color); }
.box-title { display: block; font-weight: 800; color: var(--primary); font-size: 22px; line-height: 1.15; }
.text-content { font-size: 18px; font-weight: 600; line-height: 1.35; color: var(--text); margin: 0; }

.card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.card-icon { width: 28px; height: 28px; flex-shrink: 0; color: var(--secondary); }
.card-icon svg { width: 100%; height: 100%; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.content.grid-cards-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; align-content: center; }
.content.grid-cards-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-content: center; }
.card { background: var(--card); padding: 18px 18px; border-radius: var(--radius); border-top: var(--accent-w) solid var(--secondary); box-shadow: 0 4px 10px rgba(18,58,99,.06); display: flex; flex-direction: column; }
.single-block { align-items: center; justify-content: center; }
.single-card { width: 100%; margin: auto 0; padding: 22px 40px 26px; text-align: left; background: var(--card); border-radius: var(--radius); box-shadow: 0 4px 10px rgba(18,58,99,.06); border-top: var(--accent-w) solid var(--secondary); }
.single-card .box-title { font-size: 28px; margin-bottom: 8px; }
.single-card .text-content { font-size: 23px; font-weight: 650; line-height: 1.38; text-align: left; }
.single-card.dropcap .text-content::first-letter { font-size: 58px; font-weight: 800; color: var(--secondary); float: left; line-height: .82; padding-right: 10px; }
.underline-word { position: relative; font-weight: 800; color: var(--primary); white-space: nowrap; }
.underline-word svg { position: absolute; left: 0; bottom: -6px; width: 100%; height: 8px; }

.hero-sheet { justify-content: center; }
.lone-star { width: 54px; height: 54px; margin-bottom: 10px; }
.hero-title { font-size: 54px; color: var(--primary); margin: 0; font-weight: 800; letter-spacing: -1px; line-height: .95; }
.hero-subtitle { font-size: 28px; margin: 16px 0 0; color: var(--text); font-weight: 650; line-height: 1.3; }
.hero-author { margin-top: 22px; font-size: 22px; font-weight: 700; line-height: 1.4; color: var(--primary); }

.content.bignum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.bignum-card { background: var(--card); border-radius: var(--radius); padding: 22px 16px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; box-shadow: 0 4px 10px rgba(18,58,99,.06); border-top: 6px solid var(--secondary); }
.bignum-value { font-size: 48px; font-weight: 800; color: var(--primary); line-height: 1; }
.bignum-unit { font-size: 18px; font-weight: 800; color: var(--secondary); margin-left: 4px; }
.bignum-label { font-size: 18px; font-weight: 650; color: var(--text); margin-top: 10px; line-height: 1.25; }

.content.timeline-wrap { position: relative; height: 100%; display: flex; align-items: center; padding: 0 6px; }
.timeline-track { display: flex; justify-content: space-between; width: 100%; position: relative; }
.timeline-track::before { content: ''; position: absolute; left: 24px; right: 24px; top: 12px; height: 4px; background: var(--secondary); opacity: .45; border-radius: 4px; }
.t-step { flex: 1; text-align: center; position: relative; padding: 0 8px; }
.t-dot { width: 26px; height: 26px; border-radius: 50%; background: var(--secondary); border: 5px solid var(--bg); box-shadow: 0 0 0 2px var(--secondary); margin: 0 auto 14px; position: relative; z-index: 2; }
.t-step:nth-child(even) .t-dot { background: var(--gold-color); box-shadow: 0 0 0 2px var(--gold-color); }
.t-label { font-weight: 800; color: var(--primary); font-size: 17px; }
.t-text { font-size: 15px; font-weight: 650; color: var(--text); line-height: 1.28; margin: 6px auto 0; }

.pill-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.pill { padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; color: var(--primary); background: #fff4dc; }
.check-list { display: flex; flex-direction: column; gap: 10px; }
.check-item { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 12px; padding: 12px 16px; box-shadow: 0 2px 6px rgba(18,58,99,.05); }
.check-icon { width: 24px; height: 24px; flex-shrink: 0; color: #15803d; }
.check-text { font-size: 18px; font-weight: 650; color: var(--text); line-height: 1.28; }

.theme-texas {
    --primary: #123a63; --primary-dark: #0c2744; --secondary: #e8b84a; --bg: #fff8ef;
    --card: #ffffff; --text: #14202c; --radius: 16px; --accent-w: 7px; --gold-color: #c2410c;
}
</style>
</head>
<body>
<div class="deck-container" id="slides"></div>
<script>
const AUTHOR = "Maxim Hrehor  ·  Kvinta  ·  Lutheran Grammar School of J.A. Comenius";
const star = `<svg class="lone-star" viewBox="0 0 24 24" aria-hidden="true"><path fill="#ffe08a" d="M12 2.2 14.7 8.6 21.6 9.2 16.4 13.6 18 20.4 12 16.8 6 20.4 7.6 13.6 2.4 9.2 9.3 8.6Z"/></svg>`;
const underline = (words) => `<span class="underline-word">${words}<svg viewBox="0 0 200 8" preserveAspectRatio="none"><path d="M2 5 Q50 1 100 5 T198 4" fill="none" stroke="var(--gold-color)" stroke-width="3" stroke-linecap="round"/></svg></span>`;
const icon = (path) => `<svg viewBox="0 0 24 24"><path d="${path}"/></svg>`;

const data = [
    {
        theme: "texas", template: "hero",
        title: "Texas",
        subtitle: "The Lone Star State. A place, its people, and one hard question.",
        author: "Maxim Hrehor<br>Lutheran Grammar School of J.A. Comenius · Kvinta",
        credit: "CupWithSoda19 · CC BY-SA 4.0 · Wikimedia Commons"
    },
    {
        theme: "texas", template: "bignum", tag: "Geographic orientation",
        title: "Texas at a glance",
        credit: "Carol M. Highsmith · public domain · Wikimedia Commons",
        boxes: [
            { value: "2nd", label: "largest state, after Alaska" },
            { value: "Austin", label: "the capital" },
            { value: "30", unit: "million+", label: "people, and still growing" }
        ]
    },
    {
        theme: "texas", template: "single-block", tag: "Physical geography",
        title: "Rain, pines, and the Gulf",
        heading: "The wet east",
        credit: "Maciej Kraus · CC BY 2.0 · Wikimedia Commons",
        body: "Pine woods and the Gulf coast get the most rain. Summers are hot and humid. Hurricanes can reach the shore."
    },
    {
        theme: "texas", template: "single-block", tag: "Physical geography",
        title: "Rivers and rolling land",
        heading: "Hills and plains",
        credit: "Lorenzo The Snail · CC BY-SA 4.0 · Wikimedia Commons",
        body: "The Hill Country sits between rivers and open plains. Winters are usually mild. Storms and a sudden cold can still arrive."
    },
    {
        theme: "texas", template: "single-block", tag: "Physical geography",
        title: "Desert, canyons, little water",
        heading: "The dry west",
        credit: "Martin Proll · public domain · Wikimedia Commons",
        body: "Big Bend holds desert, canyons, and mountains. Days are very hot. Nights can be cold, and water is scarce."
    },
    {
        theme: "texas", template: "timeline", tag: "History",
        title: "How Texas became Texas",
        credit: "DatraxMada · CC BY-SA 4.0 · Wikimedia Commons",
        items: [
            { step: "First nations", text: "Caddo, Comanche, and Apache peoples lived here for centuries." },
            { step: "Spain and Mexico", text: "Missions came first. Later, Texas was part of Mexico." },
            { step: "1836", text: "Texas became an independent republic." },
            { step: "1845", text: "It joined the United States as the 28th state." },
            { step: "1901", text: "Oil at Spindletop changed the towns and the jobs." }
        ]
    },
    {
        theme: "texas", template: "single-block", dropcap: true, tag: "Cultural identity",
        title: "Many stories, one star",
        heading: "More than one people",
        credit: "Ashland Thomas · CC BY-SA 4.0 · Wikimedia Commons",
        body: `Many nations knew this land before any flag. Spanish and Mexican families built towns and a Tejano culture that is still here. Later came Anglo settlers, African Americans, Czechs, and Germans. The ${underline("Lone Star")} is one symbol, not the whole story.`
    },
    {
        theme: "texas", template: "single-block", tag: "Economy",
        title: "Oil, gas, and the wind",
        heading: "Energy",
        credit: "Matthew T Rader · CC BY-SA 4.0 · Wikimedia Commons",
        body: "Texas produces oil and natural gas. It also leads the United States in wind power. That strength comes with a duty to use it carefully."
    },
    {
        theme: "texas", template: "grid-2", tag: "Economy",
        title: "Cities, ports, and ranches",
        credit: "U.S. Fish and Wildlife Service · public domain · Wikimedia Commons",
        boxes: [
            { icon: icon("M4 20V10l8-6 8 6v10M9 20v-6h6v6"), t: "Cities of ideas", d: "Austin builds technology. Houston runs a great port and the Johnson Space Center." },
            { icon: icon("M4 16c2-6 4-6 6 0s4 6 6 0 4-6 4 0"), t: "Land and cattle", d: "Cotton and cattle still matter. Ranches keep an older picture of Texas alive." }
        ]
    },
    {
        theme: "texas", template: "single-block", dropcap: true, tag: "Demographics and society",
        title: "A state that keeps growing",
        heading: "Cities and open country",
        credit: "David Daniel Turner · CC BY 4.0 · Wikimedia Commons",
        body: `Texas is home to ${underline("more than 30 million")} people. Houston, Dallas, San Antonio, and Austin are huge, while much of the land is still ranches and small towns. About two in five residents are Hispanic or Latino. People move here for work, so schools and languages keep changing.`
    },
    {
        theme: "texas", template: "grid-2", tag: "A current challenge",
        title: "The week the power stopped",
        credit: "Jno.skinner · CC BY-SA 4.0 · Wikimedia Commons",
        boxes: [
            { icon: icon("M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"), t: "What happened", d: "In February 2021, extreme cold froze equipment. Millions of homes lost heat. Most of the grid is run by ERCOT, not by the national networks." },
            { icon: icon("M12 3 4 7v6c0 5 3.5 7.5 8 9 4.5-1.5 8-4 8-9V7l-8-4z"), t: "A fair next step", d: "Some want Texas to stay independent. Others want links to neighboring states. One practical step is to prepare plants and fuel lines for freezing weather." }
        ]
    },
    {
        theme: "texas", template: "checklist", tag: "Evidence",
        title: "Where these facts come from",
        credit: "Montysayshello · CC BY-SA 4.0 · Wikimedia Commons",
        pills: ["Geography", "History", "Economy", "Society"],
        items: [
            "U.S. Census Bureau — population and communities",
            "Texas State Historical Association — the republic, 1845, and Spindletop",
            "National Weather Service — climate and the February 2021 storm",
            "ERCOT public reports — how most of the Texas grid is organized"
        ]
    },
    {
        theme: "texas", template: "hero",
        title: "Thank you",
        subtitle: "Ask me one question: a place, a date, or the winter storm.",
        author: "Maxim Hrehor<br>Lutheran Grammar School of J.A. Comenius · Kvinta",
        credit: "Carol M. Highsmith · public domain · Wikimedia Commons"
    }
];

function card(b) {
    const head = b.icon
        ? `<div class="card-header"><div class="card-icon">${b.icon}</div><span class="box-title">${b.t}</span></div>`
        : `<span class="box-title">${b.t}</span>`;
    return `<div class="card">${head}<div class="text-content">${b.d}</div></div>`;
}
const checkIcon = `<svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/></svg>`;
const renderers = {
    "grid-3": s => `<div class="content grid-cards-3">${s.boxes.map(card).join("")}</div>`,
    "grid-2": s => `<div class="content grid-cards-2">${s.boxes.map(card).join("")}</div>`,
    "bignum": s => `<div class="content bignum">${s.boxes.map(b => `<div class="bignum-card"><div class="bignum-value">${b.value}${b.unit ? `<span class="bignum-unit">${b.unit}</span>` : ""}</div><div class="bignum-label">${b.label}</div></div>`).join("")}</div>`,
    "timeline": s => `<div class="content timeline-wrap"><div class="timeline-track">${s.items.map(it => `<div class="t-step"><div class="t-dot"></div><div class="t-label">${it.step}</div><div class="t-text">${it.text}</div></div>`).join("")}</div></div>`,
    "single-block": s => `<div class="content single-block"><div class="single-card${s.dropcap ? " dropcap" : ""}"><span class="box-title">${s.heading}</span><div class="text-content">${s.body}</div></div></div>`,
    "checklist": s => `<div class="content"><div class="pill-row">${s.pills.map(p => `<span class="pill">${p}</span>`).join("")}</div><div class="check-list">${s.items.map(t => `<div class="check-item">${checkIcon}<span class="check-text">${t}</span></div>`).join("")}</div></div>`
};

function photoCard(i, credit) {
    const n = String(i + 1).padStart(2, "0");
    const skies = ["#1d6aa5", "#0e7490", "#14532d", "#b45309", "#9a3412", "#1e3a5f", "#7c2d12", "#0369a1", "#3f6212", "#1e40af", "#0f766e", "#123a63", "#166534"];
    const grounds = ["#e8b84a", "#d6d3d1", "#86efac", "#fdba74", "#fcd34d", "#fde68a", "#fdba74", "#93c5fd", "#fbbf24", "#7dd3fc", "#bae6fd", "#e8b84a", "#86efac"];
    return `<div class="pcard photo"><span class="pip">T ★</span><svg class="scene" viewBox="0 0 200 320" preserveAspectRatio="xMidYMid slice"><rect width="200" height="320" fill="${skies[i]}"/><circle cx="150" cy="54" r="28" fill="#ffe08a"/><path d="M0 190 C40 160 70 210 110 180 C150 150 170 200 200 170 V320 H0 Z" fill="${grounds[i]}"/></svg><img src="../Texas/slides/${n}.jpg" alt="" onerror="this.style.display='none'"><div class="credit">${credit}</div></div>`;
}
function nameCard(inner) {
    return `<div class="pcard textcard"><div class="spine">Texas</div><div class="sheet">${inner}</div></div>`;
}
function buildSlide(s, index, total) {
    const theme = `theme-${s.theme}`;
    const foot = `<div class="footer"><span>${AUTHOR}</span><span>Slide ${index + 1}/${total}</span></div>`;
    const inner = s.template === "hero"
        ? `<div class="hero-sheet">${star}<h1 class="hero-title">${s.title}</h1><p class="hero-subtitle">${s.subtitle}</p><div class="hero-author">${s.author}</div></div>`
        : `<div class="header"><div class="header-tag">${s.tag}</div><h1 class="title">${s.title}</h1></div>${renderers[s.template](s)}`;
    return `<div class="slide ${theme}"><div class="pair">${photoCard(index, s.credit)}${nameCard(inner)}</div>${foot}</div>`;
}
document.getElementById("slides").innerHTML = data.map((s, i) => buildSlide(s, i, data.length)).join("");
if (new URLSearchParams(location.search).has("present")) {
    document.body.classList.add("present");
    const slides = [...document.querySelectorAll(".slide")];
    let index = 0;
    const bar = document.createElement("nav");
    bar.className = "present-bar";
    bar.innerHTML = `<button type="button" id="present-prev">←</button><span id="present-count"></span><button type="button" id="present-next">→</button>`;
    document.body.appendChild(bar);
    const count = document.getElementById("present-count");
    const fit = () => {
        const slide = slides[index];
        const scale = Math.min(window.innerWidth / slide.offsetWidth, (window.innerHeight - 72) / slide.offsetHeight);
        document.documentElement.style.setProperty("--fit", String(scale));
    };
    const show = (next) => {
        index = (next + slides.length) % slides.length;
        slides.forEach((slide, i) => slide.classList.toggle("active", i === index));
        count.textContent = `${index + 1} / ${slides.length}`;
        fit();
    };
    document.getElementById("present-prev").onclick = () => show(index - 1);
    document.getElementById("present-next").onclick = () => show(index + 1);
    document.addEventListener("keydown", (event) => {
        if (["ArrowRight", "ArrowDown", "PageDown", " "].includes(event.key)) { event.preventDefault(); show(index + 1); }
        if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(event.key)) { event.preventDefault(); show(index - 1); }
    });
    window.addEventListener("resize", fit);
    show(0);
}
</script>
</body>
</html>
