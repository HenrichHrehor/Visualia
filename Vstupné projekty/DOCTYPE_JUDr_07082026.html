<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reforma Sociálnych Služieb 2026 - Tier 1 Odborná Komisia</title>
    <style>
        /* === SYSTEM ENGINE & TIER 1 PALETTE (A4 Landscape) === */
        :root {
            --font-family: 'Inter', 'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif;
            --page-width: 297mm;
            --page-height: 210mm;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            
            /* Tier 1 Color Palette */
            --primary: #0f172a;         /* Tmavomodrá */
            --primary-light: #f1f5f9;   /* Jemné modrosivé pozadie */
            --accent: #c5a059;          /* Zlatá */
            --accent-light: #fefce8;    /* Presvetlená zlatá pre akcenty */
            --border-color: #cbd5e1;
            --shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
            --danger: #dc2626;          /* Červená pre finančný dopad a výstrahy */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: #e2e8f0;
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* === A4 LANDSCAPE PAGE CONTAINER === */
        .page {
            width: var(--page-width);
            height: var(--page-height);
            background: var(--card-bg);
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.12);
            padding: 18mm 22mm 15mm 22mm;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
            page-break-after: always;
            page-break-inside: avoid;
        }

        /* === HEADER === */
        .slide-header {
            border-bottom: 3px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 16px;
        }

        .slide-header h1 {
            font-size: 21pt;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 800;
        }

        .slide-header h2 {
            font-size: 13pt;
            color: var(--accent);
            font-weight: 600;
            margin-top: 3px;
        }

        /* === CONTENT BODY (AIRY LAYOUT) === */
        .slide-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 18px;
            justify-content: flex-start;
        }

        /* === HERO LAYOUT === */
        .hero-container {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 30px;
        }

        .hero-title {
            font-size: 32pt;
            color: var(--primary);
            font-weight: 800;
            line-height: 1.25;
            margin-bottom: 18px;
        }

        .hero-subtitle {
            font-size: 16pt;
            color: var(--accent);
            font-weight: 700;
            max-width: 85%;
            margin-bottom: 28px;
        }

        .hero-meta {
            font-size: 11.5pt;
            color: var(--text-muted);
            border-top: 2px solid var(--accent);
            padding-top: 18px;
            width: 65%;
            line-height: 1.6;
        }

        /* === BLOCKS & AIRY CARDS === */
        .info-box {
            background: var(--primary-light);
            border-left: 5px solid var(--accent);
            padding: 16px 20px;
            border-radius: 0 8px 8px 0;
            font-size: 11pt;
            line-height: 1.6;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-top: 4px solid var(--primary);
            border-radius: 8px;
            padding: 20px 22px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .card h3 {
            font-size: 12.5pt;
            color: var(--primary);
            margin-bottom: 12px;
            font-weight: 700;
            border-bottom: 1px solid var(--primary-light);
            padding-bottom: 6px;
        }

        ul {
            list-style-position: inside;
            margin-left: 4px;
        }

        li {
            margin-bottom: 8px;
            font-size: 10.5pt;
            line-height: 1.5;
        }

        p {
            font-size: 10.5pt;
            color: var(--text-main);
            line-height: 1.6;
        }

        .highlight-red {
            color: var(--danger);
            font-weight: 800;
            font-size: 11.5pt;
        }

        /* === TIMELINE COMPONENT === */
        .timeline-container {
            display: flex;
            justify-content: space-between;
            position: relative;
            margin: 30px 0 10px 0;
            gap: 18px;
        }

        .timeline-container::before {
            content: '';
            position: absolute;
            top: 24px;
            left: 12%;
            right: 12%;
            height: 4px;
            background: var(--accent);
            z-index: 1;
        }

        .timeline-step {
            position: relative;
            z-index: 2;
            flex: 1;
            text-align: center;
        }

        .timeline-badge {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--primary);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 13pt;
            margin: 0 auto 16px auto;
            border: 3px solid var(--accent);
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        .timeline-card {
            background: var(--primary-light);
            border: 1px solid var(--border-color);
            border-top: 3px solid var(--primary);
            border-radius: 8px;
            padding: 16px;
            text-align: left;
            height: calc(100% - 65px);
        }

        .timeline-date {
            font-weight: bold;
            color: var(--accent);
            font-size: 11.5pt;
            margin-bottom: 8px;
        }

        /* === TABLES === */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 9.5pt;
            margin-top: 8px;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 9px 12px;
            text-align: left;
        }

        th {
            background-color: var(--primary);
            color: #ffffff;
            font-weight: 600;
            border-bottom: 2px solid var(--accent);
        }

        tr:nth-child(even) {
            background-color: var(--primary-light);
        }

        /* === FOOTER === */
        .slide-footer {
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
            margin-top: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 9pt;
            color: var(--text-muted);
        }

        .footer-text {
            font-weight: 600;
            color: var(--primary);
            width: 100%;
            display: flex;
            justify-content: space-between;
        }

        /* === PRINT OVERRIDES === */
        @media print {
            body {
                background: none;
                padding: 0;
                margin: 0;
            }
            .page {
                box-shadow: none;
                margin: 0;
                width: 297mm;
                height: 210mm;
            }
            @page {
                size: 297mm 210mm landscape;
                margin: 0;
            }
        }
    </style>
</head>
